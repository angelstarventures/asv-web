# ASV Investment Tracker — Data Connect schema (source of truth for the Postgres/GraphQL data model).
# Enum values and required-field shapes are pulled from mock-data/asv_master_portfolio_schema.json (draft 2020-12 JSON Schema).
# NOTE: Data Connect's directive surface (@table/@col/@default/@ref/@index) is still evolving — verify each
# directive against the installed firebase-tools version with `firebase emulators:start --only dataconnect`
# before relying on generated SQL. CHECK constraints and jsonb columns are NOT expressible here — see
# schema/post_migrations/*.sql, applied by scripts/apply-post-migrations.ts after every `dataconnect:sql:migrate`.

# ---------------------------------------------------------------------------
# Enums (mirrors asv_master_portfolio_schema.json's `enum` arrays exactly)
# ---------------------------------------------------------------------------

enum Role {
  ADMIN
  MEMBER
  SITE_ADMIN
}

enum MemberStatus {
  ACTIVE
  DISABLED
}

# Organizational classification, distinct from Role (which is purely an app-permission level —
# admin vs member). Admin-settable only, same posture as Role/MemberStatus.
enum MembershipType {
  BOARD_MEMBER
  MEMBER
  ASSOCIATE
  EMERITUS
}

enum Scenario {
  OPTIMISTIC
  BALANCED
  CONSERVATIVE
}

enum LedgerEntryType {
  PARTICIPATING_PRICED_ROUND      # Participating_PricedRound
  PARTICIPATING_SAFE_ROUND        # Participating_SAFERound
  NON_PARTICIPATING_ROUND         # NonParticipating_Round
  EXIT_EVENT                      # Exit_Event
  TRANSACTION_VALUATION_CHANGE    # Transaction_ValuationChange
  INTERNAL_VALUATION_ASSESSMENT   # Internal_ValuationAssessment
  COMPLIANCE_FLAG_CHANGE          # Compliance_FlagChange
  COMPANY_UPDATE                  # CompanyUpdate
  CUSTOM                          # any admin-defined EventTypeDefinition
}

enum CompanyHealth {
  GREEN
  YELLOW
  RED
}

enum CompanyTrajectory {
  IMPROVING
  STABLE
  DECLINING
}

enum CompanyStatus {
  ACTIVE
  EXITED
  WRITTEN_OFF
  ARCHIVED
}

enum ComplianceStatus {
  NON_HALAL
}

enum ComplianceAuditType {
  MANUAL_OVERRIDE            # Manual_Override
  SCHEDULED_SHARIAH_REVIEW   # Scheduled_Shariah_Review
  STRATEGIC_PIVOT_AUDIT      # Strategic_Pivot_Audit
}

enum ExitType {
  ACQUISITION
  IPO
  MERGER
  SHUTDOWN
  DISSOLUTION
}

enum DocumentType {
  PITCH_DECK
  DD_REPORT
  DATA_ROOM
  COMPANY_UPDATE_DOC
  SPA
  ALLOCATION_SCHEDULE
}

enum DocumentAccessDecision {
  GRANTED
  DENIED
}

# --- Deal flow (entrepreneur pitch intake + member deal room) ---

# LEAD/DUE_DILIGENCE/PRESENTING/INVESTED/INACTIVE are no longer used by the app (the UI now
# only ever shows/sets NEW/OLD/PASSED/ARCHIVED) but are kept in the enum rather than removed —
# Postgres can't cheaply drop enum values in place, and Data Connect's migration tool tries to
# fully recreate the type (and collides with itself) when a value is removed. Additive-only.
enum DealStage {
  NEW
  LEAD
  DUE_DILIGENCE
  PRESENTING
  INVESTED
  PASSED
  INACTIVE
  OLD
  ARCHIVED
}

enum FundingRound {
  FAMILY_AND_FRIENDS
  PRE_SEED
  SEED
  SERIES_A
  SERIES_B
  SERIES_C
  OTHER
}

# CONVERTIBLE_NOTE/OTHER are still selectable even though ASV won't invest in notes — the
# entrepreneur reports their actual round terms; the criteria mismatch is an admin filter
# concern, not a submission-time block.
enum SecurityType {
  PRICED_ROUND
  SAFE
  CONVERTIBLE_NOTE
  OTHER
}

enum DealDocumentType {
  PITCH_DECK
  ADDITIONAL_DOCUMENT
}

# ---------------------------------------------------------------------------
# Core entities
# ---------------------------------------------------------------------------

# id stays a zero-padded 5-digit string PK (not a UUID) — legacy IDs migrate verbatim,
# and every legacy `{"00001": amount}` allocation dict key maps straight to this FK.
type Member @table(key: "id") {
  id: String!            @col(name: "id", dataType: "varchar(5)")
  displayName: String!
  investingEntityName: String!  # backfilled to match displayName for every existing row; independently editable going forward
  email: String!         @unique
  authUid: String                      # nullable until the member's account is linked
  photoUrl: String        # data: URL (base64), self-uploaded via /member/settings; nullable
  profileText: String     # short bio, self-editable via /member/settings; nullable
  phoneNumber: String     # for WhatsApp outreach (deal-review nudges, company-update shares) — free-form, digits-only normalized when building a wa.me link
  professionalProfileUrl: String # e.g. LinkedIn — public profile link, admin-editable
  interests: [String!]    # sector/topic interest tags (e.g. Healthcare, Medical Device, IT) — distinct from expertise: self-declared areas of *interest*, not necessarily expertise
  expertise: [String!]    # resume-style skill/domain terms, self- or admin-editable — matched against Deal.keywords/sector to suggest reviewers. Merged from the former separate free-text `expertise` + `expertiseKeywords` fields; deduped case-insensitively.
  membershipType: MembershipType! @default(value: MEMBER)
  role: Role!             @default(value: MEMBER)
  status: MemberStatus!   @default(value: ACTIVE)
  aiChatEnabled: Boolean! @default(value: false)  # per-member (replaces the old per-role app_setting), site-admin-root-mode-editable only
  lockedScenario: Scenario @default(value: OPTIMISTIC)  # null = this member picks freely among all 3; site-admin-root-mode-editable only
  duesSentForYear: Int    # calendar year annual dues were last marked sent (e.g. 2026); null = not yet this cycle
  createdAt: Timestamp!   @default(expr: "request.time")
}

type Company @table {
  id: UUID!                       @default(expr: "uuidV4()")
  name: String!                    @unique       # legal/incorporated name — the natural key ledger records match on
  tradeName: String                              # the public-facing "doing business as" name, when different from name
  tagline: String                                # short public-facing description, shown on hover in the portfolio logo grid
  sector: String
  website: String                                # set from the first investment-round record (company_url), same pattern as sector
  logoUrl: String                 # set from the first investment-round record (logo_url), same pattern as sector
  ceoName: String                                # admin-editable, no other source — null until an admin fills it in
  ceoContact: String                             # free-text (email or phone) — same posture as ceoName
  currentHealth: CompanyHealth
  currentTrajectory: CompanyTrajectory
  status: CompanyStatus!          @default(value: ACTIVE)
  ddLead: Member                                 # the member who ran due diligence on this investment — admin-editable, nullable
}

# Durable, per-company Google Search-grounded market research — decoupled from the Vertex AI
# context cache's own lifecycle (which is just a compiled snapshot of this + ledger data). A
# request about one company can refresh just that company's row (fast, ~15-30s) without waiting
# on the rest of the portfolio; the shared cache is rebuilt from whatever's currently in this
# table, only re-researching companies whose row has gone stale (see
# functions/src/lib/portfolioContextCache.ts). Staleness threshold is the admin-configurable
# "portfolio_research_staleness_days" AppSetting, not a fixed value here.
type CompanyMarketResearch @table {
  id: UUID!                 @default(expr: "uuidV4()")
  company: Company!         @unique
  marketResearchGrounding: String!
  sources: [String!]
  researchedAt: Timestamp!  @default(expr: "request.time")
}

# Base ledger row — append-only, never updated in place. One row per (event, scenario).
# Composite index covers the dashboard's (company, scenario, eventDate DESC) read path;
# `type` also gets a single-column index for the mass-export/rollup-scan path (plan §2).
type LedgerEntry
  @table
  @index(fields: ["companyId", "scenario", "eventDate"], order: [ASC, ASC, DESC])
{
  id: UUID!                @default(expr: "uuidV4()")
  company: Company!
  scenario: Scenario!
  type: LedgerEntryType!   @index
  eventDate: Date!
  sourceDocument: String            # doc_link from the legacy schema; superseded by Document rows going forward
  createdBy: Member!
  createdAt: Timestamp!    @default(expr: "request.time")
  needsReview: Boolean!    @default(value: false)
}

# --- Per-type detail tables, 1:1 with LedgerEntry (LedgerEntry.type is the discriminator) ---

type PricedRoundDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  companyUrl: String
  docLink: String
  asvTotal: Float!
  totalRoundSize: Float # the company's full raise across every investor — null for rounds entered before this field existed
  roundName: String!
  pricePerShare: Float!
  postMoneyValuation: Float!
}

type SafeRoundDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  companyUrl: String
  docLink: String
  asvTotal: Float!
  totalRoundSize: Float # the company's full raise across every investor — null for rounds entered before this field existed
  postMoneyValCap: Float!
  discount: Float!                   # CHECK 0..100 — see post_migrations/001
  warrantShares: Float
  warrantShareClass: String
  warrantExercisePrice: Float
  warrantExpirationYears: Float
  warrantVestingTerms: String
  notes: String
}

type NonParticipatingRoundDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  roundName: String!
  newPricePerShare: Float!
  newPostMoneyValuation: Float!
  totalRoundSize: Float # the company's full raise across every investor — null for rounds entered before this field existed
  docLink: String
  notes: String
}

type ExitEventDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  exitType: ExitType!
  totalExitValue: Float!
  asvTotalPayout: Float!
  docLink: String
}

# Shared by Transaction_ValuationChange and Internal_ValuationAssessment — identical field
# shape in the source schema; LedgerEntry.type is what distinguishes them.
type ValuationAssessmentDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  drivingEventDate: Date!
  asvTotalFairMarketValue: Float!
  impliedEnterpriseValue: Float
  assessmentRationale: String
  # viewpoint_analysis, flattened (same pattern as SafeRoundDetail's warrant* fields) — only
  # meaningful for INTERNAL_VALUATION_ASSESSMENT rows (optional there); always null for
  # TRANSACTION_VALUATION_CHANGE rows, which this table is also shared by.
  viewpointScenario: Scenario
  viewpointMarketResearchGrounding: String
  viewpointValuationImpactSummary: String
}

# Halal/Shariah screening only — status is always NON_HALAL when this row exists.
type ComplianceFlagDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  status: ComplianceStatus! @default(value: NON_HALAL)
  flaggedDate: Date!
  reason: String!
  auditType: ComplianceAuditType!
  complianceOfficerNotes: String!
}

type CompanyUpdateDetail @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  health: CompanyHealth!
  trajectory: CompanyTrajectory!
  highlights: [String!]!
  lowlights: [String!]!
  upcomingPlans: [String!]!
  # viewpoint_analysis, flattened (same pattern as SafeRoundDetail's warrant* fields) — required
  # for every CompanyUpdate going forward. Existing rows predate this field: backfilled to ""
  # (text fields) and the row's own ledger entry scenario (see post_migrations/003).
  viewpointScenario: Scenario!                @default(value: BALANCED)
  viewpointMarketResearchGrounding: String!   @default(value: "")
  viewpointValuationImpactSummary: String!    @default(value: "")
  viewpointWebSources: [String!]
}

# --- Per-member breakdowns ---

type Allocation @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry!
  member: Member!            @index
  amount: Float!             # CHECK amount >= 0
}

type MemberValuation @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry!
  member: Member!            @index
  value: Float!               # CHECK value >= 0
}

# --- Documents & access audit trail ---

type Document @table {
  id: UUID!            @default(expr: "uuidV4()")
  driveFileId: String! @unique
  driveUrl: String!
  filename: String     # the real uploaded filename — nullable only for rows predating this field, backfilled from Drive's own file metadata
  docType: DocumentType!
  company: Company!
  uploadedBy: Member!
  uploadedAt: Timestamp! @default(expr: "request.time")
}

type DocumentAccessLog @table {
  id: UUID!               @default(expr: "uuidV4()")
  document: Document!
  accessedBy: Member!
  accessedAt: Timestamp!  @default(expr: "request.time")
  decision: DocumentAccessDecision!
  reason: String!
}

# Per-member (NOT per-company) confidential document, e.g. a K-1 — deliberately a separate table
# from Document rather than a nullable company/added member FK there: the access rule is
# fundamentally different (only that one member + admins, vs. Document's fund-wide/allocation-
# based visibility), so reusing Document's access-matrix machinery would be the wrong fit.
type TaxDocument @table {
  id: UUID!              @default(expr: "uuidV4()")
  member: Member!                    # whose tax document this is — the confidentiality boundary
  taxYear: Int
  driveFileId: String!   @unique
  driveUrl: String!
  filename: String!
  uploadedBy: Member!                 # the admin who uploaded it
  uploadedAt: Timestamp! @default(expr: "request.time")
}

# --- Event-type registry (FR-10a) ---

type EventTypeDefinition @table {
  id: UUID!          @default(expr: "uuidV4()")
  key: String!        @unique
  label: String!
  description: String
  isBuiltin: Boolean! @default(value: false)
  fieldSchema: String! # JSON-as-text; converted to jsonb by post_migrations/002
  createdBy: Member!
  createdAt: Timestamp! @default(expr: "request.time")
}

type CustomEventDetail @table {
  id: UUID!                     @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry!     @unique
  eventTypeDefinition: EventTypeDefinition!
  data: String!                 # JSON-as-text; converted to jsonb by post_migrations/002 — see the jsonb spike (plan §2)
}

# One row per ledger entry written by mass-import or migrate-legacy-data, recording the
# content hash used at write time — the natural-key + hash lookup that makes
# ledger-massImportDiff's NEW/UNCHANGED/NEW_CORRECTION classification and the migration
# script's idempotent re-run both possible (plan §3/§5).
type ImportedRecordHash @table {
  id: UUID!                 @default(expr: "uuidV4()")
  ledgerEntry: LedgerEntry! @unique
  contentHash: String!      @index
}

# --- Precomputed rollups (read path for every dashboard) ---

# @table key fields must be non-null, but `company` must be nullable to represent the single
# portfolio-level row per scenario — so the real key is a non-null sentinel string
# ("PORTFOLIO" or Company.id) kept in lockstep with the nullable FK by application code.
type RollupCache @table(
  key: ["companyKey", "scenario"]
) {
  companyKey: String!          # Company.id as text, or the literal "PORTFOLIO"
  company: Company             # null for the single portfolio-level row per scenario
  scenario: Scenario!
  moic: Float!
  unrealizedValue: Float!
  realizedValue: Float!
  # Mark-to-market "IRR to date" — only ever set on the single portfolio-level row (dated
  # capital-call outflows + any real distribution inflows + current unrealizedValue as one
  # terminal inflow "now"). Null on every per-company row (not computed there).
  irr: Float
  computedAt: Timestamp! @default(expr: "request.time")
}

# --- AI settings (Phase 2) ---

# Fixed, small set of keys ("document_analysis", "portfolio_chat") — a plain key/value config
# table rather than one row per feature, since there are only ever two of these and no other
# generic settings table exists yet.
type AiPromptSetting @table(key: "key") {
  key: String!
  prompt: String!
  updatedAt: Timestamp! @default(expr: "request.time")
  updatedBy: Member!
}

# Generic app-wide feature toggles, admin-controlled (plan: simplified member view). Fixed set
# of keys ("member_ai_chat_enabled", "member_locked_scenario") — same key/value shape as
# AiPromptSetting, kept as its own table rather than merged into it since the value semantics
# differ (a flag/enum string here, a full prompt there).
type AppSetting @table(key: "key") {
  key: String!
  value: String!
  updatedAt: Timestamp! @default(expr: "request.time")
  updatedBy: Member!
}

# Per-feature AI provider routing, site-admin-controlled (/admin/settings) — lets a site-admin
# move any single AI-calling feature onto OpenRouter (a cheaper/free-tier alternative model) or
# back to Vertex AI without a deploy. Fixed set of feature keys ("deal_keyword_generation",
# "deal_reviewer_matching", "document_analysis", "portfolio_chat"); a feature with no row yet
# defaults to Vertex (functions/src/lib/aiProviderSettings.ts's fallback) — same "works before
# an admin ever visits Settings" posture as AiPromptSetting.
type AiProviderSetting @table(key: "key") {
  key: String!
  provider: String!      @default(value: "vertex")  # "vertex" | "openrouter"
  openrouterModel: String                            # required in practice when provider = "openrouter"; free-text since OpenRouter's model catalog is large and changes often
  openrouterProviderSlug: String                     # optional — pins OpenRouter's own upstream routing to one named reseller (e.g. "deepinfra") via the request-level provider.order + allow_fallbacks:false, instead of letting OpenRouter pick/rotate between whichever resellers serve openrouterModel. Blank means no pin (OpenRouter's own default routing).
  searchBackend: String! @default(value: "vertex")   # "vertex" | "serper" — only meaningful for document_analysis (market-research grounding) and portfolio_chat (NEEDS_RESEARCH); ignored by the other 2 keys, which never do a live web search. "vertex" uses Vertex AI's own Google Search grounding tool; "serper" fetches raw results from Serper.dev and synthesizes them via that feature's own AiProviderSetting.provider instead — cheaper, and lets a feature fully avoid Vertex.
  updatedAt: Timestamp!  @default(expr: "request.time")
  updatedBy: Member!
}

# Serper.dev has no balance/credits API (unlike OpenRouter's /api/v1/key) — this is a
# self-tracked running counter, incremented once per serperSearch() call (functions/src/lib/
# serper.ts), backing the site-admin Costs page's Serper tile with an estimate (count * list
# price per query) rather than a true remaining-balance figure, which only Serper's own
# dashboard actually knows.
type SerperUsageCounter @table(key: "key") {
  key: String!            # fixed to "total" — a single row, not one per feature
  queryCount: Int!        @default(value: 0)
  updatedAt: Timestamp!   @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
# Phase 2/3 tables — created now so the schema doesn't need a breaking migration later,
# unused by any V1 write/read path.
# ---------------------------------------------------------------------------

type AiProcessingJob @table {
  id: UUID!         @default(expr: "uuidV4()")
  company: Company!
  status: String!
  requestedBy: Member!
  createdAt: Timestamp! @default(expr: "request.time")
}

# ---------------------------------------------------------------------------
# Deal flow — public pitch intake (Deal/DealDocument) + member deal room
# (DealTag/DealTagAssignment/DealRating). Deals are deliberately NOT Company
# rows: Company already drives real MOIC/rollup/ledger reporting and should
# never hold never-funded prospects. `linkedCompany` is set only if/when an
# admin later promotes a won deal into a real portfolio Company.
# ---------------------------------------------------------------------------

type Deal @table {
  id: UUID!                    @default(expr: "uuidV4()")
  companyName: String!
  companyEmail: String!
  companyUrl: String       # NOT NULL at the app level (dealsSubmitPitch/PitchForm) — nullable
                            # here only because existing rows predate this field; no backfill.
  entrepreneurName: String!
  entrepreneurEmail: String!
  entrepreneurPhone: String!
  executiveSummary: String
  teamInformation: String
  round: FundingRound!
  securityType: SecurityType!
  seekingAmount: Float!
  currency: String!            @default(value: "USD")  # ISO 4217 code — the round's currency
  # Required for a priced round; null for a SAFE, which uses valuationCap/discountPercent
  # instead (a SAFE has no pre-money valuation in the traditional sense).
  preMoneyValuation: Float
  # SAFE-only terms — typically a post-money valuation cap, optionally with a discount.
  # Both nullable: a SAFE can have a cap with no discount, a discount with no cap, or (rare)
  # neither ("uncapped, no discount" MFN-only SAFE). Enforced/required as appropriate at the
  # app level (PitchForm/dealsSubmitPitch), not by a DB NOT NULL constraint.
  valuationCap: Float
  discountPercent: Float                                 # CHECK 0..100 — see post_migrations/001
  hasLeadInvestor: Boolean!
  leadInvestorName: String
  willHaveInterestBearingDebtAfterClose: Boolean!
  hasExistingInterestBearingDebt: Boolean!
  hasRestrictedBusinessLines: Boolean!   # gambling/alcohol/insurance/financial services
  raiseMethod: String                    # nullable — the question asking this was removed from the form
  referredBy: String
  # AI-derived from companyUrl (Vertex AI, functions/src/functions/deals-submitPitch.ts) —
  # nullable since the fetch/analysis is best-effort and must never block a real submission.
  sector: String
  keywords: [String!]
  companyLocation: String       # AI-derived HQ city/region, same best-effort posture as sector
  # The screening call queue: a deal is "above the line" simply by having a rank at all — null
  # means not currently in consideration. Admins add a deal to the ranked list (assigning it
  # the next rank) and drag-reorder within it; removing it from the list sets this back to
  # null. 1 = most interesting. Not unique/contiguous by DB constraint — the app keeps it
  # dense (1..N) on every reorder, but nothing breaks if it briefly isn't.
  rank: Int
  stage: DealStage!            @default(value: NEW)
  driveFolderId: String
  driveFolderUrl: String
  linkedCompany: Company
  createdAt: Timestamp!        @default(expr: "request.time")
  updatedAt: Timestamp!        @default(expr: "request.time")
}

# Prior funding rounds the entrepreneur reports at pitch time (round type + amount, in the
# currency they raised in) — zero or more per deal. Entrepreneur-reported and immutable after
# submission (no update/delete path); dealsSubmitPitch is the only writer.
type DealFundingRoundEntry @table {
  id: UUID!             @default(expr: "uuidV4()")
  deal: Deal!
  round: FundingRound!
  amount: Float!
  currency: String!     @default(value: "USD")
  createdAt: Timestamp! @default(expr: "request.time")
}

type DealDocument @table {
  id: UUID!              @default(expr: "uuidV4()")
  deal: Deal!
  docType: DealDocumentType!
  driveFileId: String!
  driveUrl: String!
  filename: String!
  uploadedAt: Timestamp! @default(expr: "request.time")
}

type DealTag @table {
  id: UUID!             @default(expr: "uuidV4()")
  name: String!         @unique
  color: String
  createdAt: Timestamp! @default(expr: "request.time")
}

# No @table(key: [...]) composite key on relation fields here — untested against this
# directive surface (see file header) and no other table in this schema relies on it.
# Uniqueness (one assignment per deal+tag, one rating per deal+member) is enforced by the
# writing Cloud Function's upsert logic instead, same posture as everywhere else in this file
# that needs more than a single-column constraint (see post_migrations/*.sql for CHECKs).
type DealTagAssignment @table {
  id: UUID! @default(expr: "uuidV4()")
  deal: Deal!
  tag: DealTag!
}

type DealRating @table {
  id: UUID!             @default(expr: "uuidV4()")
  deal: Deal!
  member: Member!
  rating: Int!
  review: String
  updatedAt: Timestamp! @default(expr: "request.time")
}

# Persisted result of "Find Reviewers" (functions/src/functions/deals-findReviewers.ts) — the
# whole point of persisting (rather than the fully ephemeral, recompute-every-open behavior this
# replaced) is so the deals list can show a "message this reviewer" WhatsApp button per match
# without recomputing. A regular admin can only populate this once per deal (the Cloud Function
# rejects re-running once rows exist); a site-admin's re-run replaces every row for that deal
# (delete-then-insert, same full-replace posture as DealFundingRoundEntry on a deal edit).
type DealReviewerMatch @table {
  id: UUID!             @default(expr: "uuidV4()")
  deal: Deal!
  member: Member!
  reason: String!
  createdAt: Timestamp! @default(expr: "request.time")
}

# A non-member's comment on a deal, submitted from the public /review/[dealId] page (a link an
# admin shares directly, outside any WhatsApp/email flow). Deliberately not a DealRating variant:
# there's no numeric 1-5 score, no Member! FK (the submitter has no account), and it's visible to
# admins only, not surfaced anywhere a regular member reads.
type DealPublicReview @table {
  id: UUID!             @default(expr: "uuidV4()")
  deal: Deal!
  reviewerName: String!
  reviewerContact: String!
  comment: String!
  createdAt: Timestamp! @default(expr: "request.time")
}
