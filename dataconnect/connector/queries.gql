query ListComplianceFlagDetailsForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Same posture as ListLedgerEntriesForScenario — portfolio-wide reporting detail for the events popup.") {
  complianceFlagDetails(where: { ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
    ledgerEntry {
      id
    }
    status
    flaggedDate
    reason
    auditType
