query ListExitEventDetailsForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Same posture as ListLedgerEntriesForScenario — portfolio-wide reporting detail for the events popup.") {
  exitEventDetails(where: { ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
