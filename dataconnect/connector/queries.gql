# Real per-page queries for Milestones 2-4. All are executed server-side via
# firebase-admin/data-connect (lib/dataconnect/client.ts), which runs with admin trust and
# ignores these @auth directives entirely — they're declared anyway as defense-in-depth /
# documentation of intent, since authorization is actually enforced in each server
# component's own code (deriving memberId from the verified session, checking role), the
# same pattern the Cloud Functions already use for raw `pg` (plan §3, Data isolation).
#
# `limit: 1000` on every list query below, even ones that look comfortably small today —
# Data Connect defaults to a silent 100-row cap with no error when exceeded. Found the hard
# way: ListLedgerEntriesForScenario (217-226 rows/scenario) and ListCompanyUpdatesForScenario
# (156-157 rows/scenario) were both silently truncating in production, and
# ListMemberAllocationsAllScenarios was already within ~10 rows of the same cliff for the
# largest investor. 1000 is headroom, not a real expected count, at V1's scale.

query ListCompanies @auth(level: PUBLIC, insecureReason: "Matches the (public) landing page's name+sector+logo company list — the query itself never selects financial fields, so public access is intentional (plan §4).") {
  companies: companies(limit: 1000) {
    id
    name
    tradeName
    tagline
    sector
    website
    logoUrl
    status
  }
}

# Backs the company detail page's header/Overview tab — a lean single-company read instead of
# pulling all ~34 companies via ListCompanies just to find one. ceoName/ceoContact excluded from
# the public ListCompanies above deliberately (admin-entered contact info, not for the public
# landing page).
query GetCompanyById($id: UUID!) @auth(level: USER, insecureReason: "Same posture as ListCompanies — no per-member scoping, every member sees every company's profile.") {
  company(key: { id: $id }) {
    id
    name
    tradeName
    tagline
    sector
    website
    logoUrl
    status
    ceoName
    ceoContact
  }
}

# Separate from ListCompanies (public) so a DD lead's identity never reaches the public landing
# page — same flat-list-reduced-client-side shape as ListDealTagAssignments/ListDealRatings.
# Only ever called from the admin-gated companies page.
query ListCompanyDdLeads @auth(level: USER, insecureReason: "Only called from app/admin/companies, gated by proxy.ts's role=admin check.") {
  companies(limit: 1000) {
    id
    ceoName
    ceoContact
    ddLead {
      id
      displayName
    }
  }
}

# Excludes "00000" (System Migration) — a synthetic, role=ADMIN account that only exists as
# the created_by/audit-trail author for migrated ledger rows (plan §5), never a real board
# member. It must stay role=ADMIN for that audit purpose, so the exclusion belongs here
# (public display) rather than on the member row itself.
query ListMemberProfiles @auth(level: PUBLIC, insecureReason: "Board & Member profiles tab on the public landing page — display name, membership tier, photo, and bio only (the same public-facing info already shown on the real angelstarventures.com/our-team page), never email/investing-entity/financial PII (plan §4, wireframe 1).") {
  members: members(where: { id: { ne: "00000" } }, limit: 1000) {
    id
    displayName
    role
    membershipType
    photoUrl
    profileText
  }
}

# The single portfolio-level row per scenario (RollupCache.company is null there) — see
# schema.gql's companyKey note for why "PORTFOLIO" is the real key.
query GetPortfolioRollup($scenario: Scenario!) @auth(level: USER, insecureReason: "Portfolio-wide totals are the same for every active member — not memberId-scoped by design (plan §4, wireframe 2).") {
  rollupCaches(where: { companyKey: { eq: "PORTFOLIO" }, scenario: { eq: $scenario } }) {
    moic
    unrealizedValue
    realizedValue
    irr
    computedAt
  }
}

# Includes the "PORTFOLIO" row (company: null) alongside per-company rows — the caller
# filters it out; simpler than fighting the exact relation-null filter syntax for one row.
query ListCompanyRollups($scenario: Scenario!) @auth(level: USER, insecureReason: "Per-company rollups are portfolio-wide reporting data, not member-specific — the member-facing dashboard's `asv` scope (plan §4, wireframe 3).") {
  rollupCaches(where: { scenario: { eq: $scenario } }, limit: 1000) {
    companyKey
    moic
    unrealizedValue
    realizedValue
    company {
      id
      name
      tradeName
      sector
      status
    }
  }
}

# Latest CompanyUpdate per company for a given scenario — computed here rather than trusting
# Company.currentHealth/currentTrajectory, which is a single scenario-agnostic cache column
# that can't correctly represent scenarios that legitimately disagree (seen in the dev-seed
# mock data); "latest per company" reduction happens in the server component (V1 scale is a
# handful of companies, no performance concern querying all rows and reducing in JS).
query ListCompanyUpdatesForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Company health/trajectory is portfolio-wide reporting data (plan §4, wireframe 2 health-mix chart). highlights/lowlights/upcomingPlans and ledgerEntry.id feed the dashboard's per-event details popup.") {
  companyUpdateDetails: companyUpdateDetails(where: { ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
    health
    trajectory
    highlights
    lowlights
    upcomingPlans
    viewpointScenario
    viewpointMarketResearchGrounding
    viewpointValuationImpactSummary
    viewpointWebSources
    ledgerEntry {
      id
      eventDate
      company {
        id
        name
        tradeName
        sector
      }
    }
  }
}

# Portfolio-wide (every member), used to sum real invested-per-company totals for the "All of
# ASV" table — RollupCache doesn't store invested capital, and reverse-deriving it from moic
# (unrealized+realized)/moic breaks for any company with moic legitimately at 0 (a total-loss
# write-off with real money invested, not just an un-invested company — found via SafKan,
# Inc., which exited for $0 after a real $130K round).
query ListAllocationsForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Portfolio-wide invested totals are the same reporting data as ListCompanyRollups, not member-specific.") {
  allocations(where: { ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
    amount
    ledgerEntry {
      id
      eventDate
      type
      company {
        id
      }
    }
  }
}

query ListLedgerEntriesForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Ledger detail table — sort/filter/document-link visibility happen in the server component (plan §4, wireframe 4); access to financial detail fields is still gated per-type by the app, this just lists the base rows.") {
  ledgerEntries(where: { scenario: { eq: $scenario } }, orderBy: { eventDate: DESC }, limit: 1000) {
    id
    eventDate
    type
    needsReview
