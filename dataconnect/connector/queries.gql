query ListNonParticipatingRoundDetailsForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Same posture as ListLedgerEntriesForScenario — portfolio-wide reporting detail for the events popup.") {
  nonParticipatingRoundDetails(where: { ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
