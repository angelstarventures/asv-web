query GetMemberById($id: String!) @auth(level: USER, insecureReason: "Used from two contexts: /admin/members/[memberId] (gated by proxy.ts's role=admin check) and /member/settings (any member reading their OWN record — id is always the server-derived caller's own memberId from getCurrentMember(), never a client-supplied one, same as every other memberId-scoped read in this app).") {
  member(key: { id: $id }) {
    id
    displayName
    investingEntityName
    email
    role
    status
    authUid
    photoUrl
    profileText
    phoneNumber
    professionalProfileUrl
    interests
    expertise
    membershipType
    aiChatEnabled
    lockedScenario
    duesSentForYear
    createdAt
  }
}

# Admin-only in practice (plan §4, ledger write flows). Selects only the plain-text columns —
# fieldSchema is deliberately never selected here. It's jsonb holding a JSON *array*, and
# Data Connect's GraphQL layer cannot coerce that shape into the schema's `String` type at
# all, even for a bare by-id read (confirmed against the live service: "is invalid String:
# unexpected value: [...] with type: []interface {}") — a sharper version of the jsonb
# spike's caveat (plan §2) than "don't filter into it." functions/eventTypes-getByKey.ts
# reads fieldSchema instead, straight through `pg` (which auto-parses jsonb), called from the
# entry/[eventType] page's client half since it's a Cloud Functions callable, not a
# Data Connect query.
query ListCustomEventTypes @auth(level: USER, insecureReason: "Gated by proxy.ts's role=admin check on every /admin/* route.") {
  eventTypeDefinitions(where: { isBuiltin: { eq: false } }, orderBy: { createdAt: DESC }, limit: 1000) {
    id
    key
    label
    description
  }
}

# Admin-only in practice — gated by proxy.ts's role=admin check on /admin/settings, not this
# directive (plan §4, Phase 2 AI). Only two rows ever exist (key = "document_analysis" or
# "portfolio_chat"); updateAiPromptSetting is the only write path.
query ListAiPromptSettings @auth(level: USER, insecureReason: "Gated by proxy.ts's role=admin check on every /admin/* route.") {
  aiPromptSettings(orderBy: { key: ASC }, limit: 10) {
