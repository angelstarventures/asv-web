query ListMemberAllocations($scenario: Scenario!) @auth(level: USER, insecureReason: "Self-scoped via auth.uid, not a client-suppliable memberId — see the eq_expr note below. The dashboard's `mine` scope (wireframe 3). `sector` feeds the mine-scope company table so it's populated even for a company with an allocation but no valuation event yet.") {
  # `member: { authUid: { eq_expr: "auth.uid" } }` — NOT `member: { id: { eq: $memberId } }`.
  # memberId used to be a plain client-suppliable variable, gated only by @auth(level: USER)
  # (any signed-in user, no ownership check) — confirmed exploitable: any member could call
  # this connector directly with the real client SDK and pass a different memberId to get
  # another member's real allocations back. This binds the filter to the caller's own
  # Firebase Auth uid at the database layer itself, so no caller (this app or a direct
  # connector call) can ever request anyone else's rows. The Admin SDK path
  # (lib/dataconnect/client.ts) supplies auth.uid via `impersonate: { authClaims: { sub } }`
  # using the session-verified uid, never a client-supplied one.
  allocations(where: { member: { authUid: { eq_expr: "auth.uid" } }, ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
    amount
    ledgerEntry {
      id
      eventDate
      company {
        id
        name
        tradeName
        sector
      }
    }
  }
}

query ListMemberValuations($scenario: Scenario!) @auth(level: USER, insecureReason: "Same auth.uid self-scoping note as ListMemberAllocations — the dashboard's `mine` scope (wireframe 3). `type` distinguishes realized (EXIT_EVENT) rows from unrealized ones; `sector` feeds the mine-scope sector-value chart. `id` lets the full-ledger-export route attach this member's own value to the right ledger entry.") {
  memberValuations(where: { member: { authUid: { eq_expr: "auth.uid" } }, ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
    value
    ledgerEntry {
      id
      eventDate
      type
      company {
        id
        name
        tradeName
        sector
      }
    }
  }
}

# No scenario filter — backs FR-6's ledger download (the whole point is every scenario in one
# file) and the documents page's "has this member ever held an allocation/valuation in this
# company, in any scenario" check, which hasHeldAllocation (plan §3) is deliberately
# scenario-agnostic about too.
query ListMemberAllocationsAllScenarios @auth(level: USER, insecureReason: "Same auth.uid self-scoping note as ListMemberAllocations (plan §3).") {
  allocations(where: { member: { authUid: { eq_expr: "auth.uid" } } }, limit: 1000) {
    amount
    ledgerEntry {
      eventDate
      scenario
      company {
        id
        name
        tradeName
      }
    }
  }
}

query ListMemberValuationsAllScenarios @auth(level: USER, insecureReason: "Same auth.uid self-scoping note as ListMemberAllocations (plan §3).") {
  memberValuations(where: { member: { authUid: { eq_expr: "auth.uid" } } }, limit: 1000) {
    value
    ledgerEntry {
      eventDate
      scenario
      company {
        id
        name
        tradeName
      }
    }
  }
}

query ListAllDocuments @auth(level: USER, insecureReason: "The role+allocation visibility check happens in application code (canViewDocument, plan §3/§4), not here — every caller of this query re-derives that decision, never trusting a client-supplied one.") {
  documents(limit: 1000) {
    id
    docType
    company {
      id
      name
      tradeName
    }
  }
}

query GetMemberByAuthUid($authUid: String!) @auth(level: USER, insecureReason: "authUid comes from the server-verified session token, never a client parameter — this is exactly how the server derives memberId in the first place (plan §3).") {
  members(where: { authUid: { eq: $authUid } }) {
    id
    displayName
    role
    status
  }
}

# Admin-only in practice — proxy.ts blocks every /admin/* request whose session claim isn't
# role=admin before this page (app/admin/members) ever renders; executed here with admin
# trust regardless, same as every other query in this file (plan §3/§4).
query ListAllMembers @auth(level: USER, insecureReason: "Gated by proxy.ts's role=admin check on every /admin/* route, not by this directive — see the file header.") {
  members(orderBy: { id: ASC }, limit: 1000) {
    id
    displayName
    investingEntityName
    email
    role
    status
    authUid
    membershipType
    createdAt
  }
}

query GetMemberById($id: String!) @auth(level: USER, insecureReason: "Used from two contexts: /admin/members/[memberId] (gated by proxy.ts's role=admin check) and /member/settings (any member reading their OWN record — id is always the server-derived caller's own memberId from getCurrentMember(), never a client-supplied one, same as every other memberId-scoped read in this app).") {
  member(key: { id: $id }) {
    id
    displayName
    investingEntityName
    email
    role
    status
    authUid
    photoUrl
    profileText
    membershipType
    createdAt
  }
}

# Admin-only in practice (plan §4, ledger write flows). Selects only the plain-text columns —
# fieldSchema is deliberately never selected here. It's jsonb holding a JSON *array*, and
# Data Connect's GraphQL layer cannot coerce that shape into the schema's `String` type at
# all, even for a bare by-id read (confirmed against the live service: "is invalid String:
# unexpected value: [...] with type: []interface {}") — a sharper version of the jsonb
# spike's caveat (plan §2) than "don't filter into it." functions/eventTypes-getByKey.ts
# reads fieldSchema instead, straight through `pg` (which auto-parses jsonb), called from the
# entry/[eventType] page's client half since it's a Cloud Functions callable, not a
# Data Connect query.
query ListCustomEventTypes @auth(level: USER, insecureReason: "Gated by proxy.ts's role=admin check on every /admin/* route.") {
  eventTypeDefinitions(where: { isBuiltin: { eq: false } }, orderBy: { createdAt: DESC }, limit: 1000) {
    id
    key
    label
    description
  }
}

# Admin-only in practice — gated by proxy.ts's role=admin check on /admin/settings, not this
# directive (plan §4, Phase 2 AI). Only two rows ever exist (key = "document_analysis" or
# "portfolio_chat"); updateAiPromptSetting is the only write path.
query ListAiPromptSettings @auth(level: USER, insecureReason: "Gated by proxy.ts's role=admin check on every /admin/* route.") {
  aiPromptSettings(orderBy: { key: ASC }, limit: 10) {
    key
    prompt
    updatedAt
  }
}

# Admin-only in practice (plan: simplified member view). Also read from the member dashboard
# server component (lib/dataconnect/client.ts's admin-trusted path) to decide whether to show
# the AI chat and whether the scenario picker is locked — that's a read, not a write, so no
# extra gate is needed there beyond the existing admin-trust posture every query in this file has.
query ListAppSettings @auth(level: USER, insecureReason: "Read from both /admin/settings (gated by proxy.ts's role=admin check) and the member dashboard (read-only feature-flag lookup, no sensitive data).") {
  appSettings(orderBy: { key: ASC }, limit: 10) {
    key
    value
  }
}
