query ListValuationAssessmentDetailsForScenario($scenario: Scenario!) @auth(level: USER, insecureReason: "Same posture as ListLedgerEntriesForScenario — portfolio-wide reporting detail for the events popup. Backs both Transaction_ValuationChange and Internal_ValuationAssessment, which share this one detail table.") {
  valuationAssessmentDetails(where: { ledgerEntry: { scenario: { eq: $scenario } } }, limit: 1000) {
    ledgerEntry {
      id
    }
    drivingEventDate
    asvTotalFairMarketValue
