query ListAppSettings @auth(level: USER, insecureReason: "Read from both /admin/settings (gated by proxy.ts's role=admin check) and the member dashboard (read-only feature-flag lookup, no sensitive data).") {
  appSettings(orderBy: { key: ASC }, limit: 10) {
    key
    value
  }
}

